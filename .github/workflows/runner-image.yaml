name: runner-image

# The worker tool baseline (toolkit/infra/buildbarn/runner/Dockerfile) as an image the cluster can pull.
on:
  push:
    branches: [main]
    paths: ["toolkit/infra/buildbarn/runner/**", ".github/workflows/runner-image.yaml"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: toolkit/infra/buildbarn/runner
          push: true
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/buckroot-worker:latest
            ghcr.io/${{ github.repository_owner }}/buckroot-worker:${{ github.sha }}
      - run: |
          echo "Pin this digest in the platform's runner_image variable: ghcr.io/${{ github.repository_owner }}/buckroot-worker@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
