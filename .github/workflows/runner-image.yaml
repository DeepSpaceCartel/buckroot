name: runner-image

# The worker tool baseline (toolkit/infra/buildbarn/runner/Dockerfile) as an image the cluster can pull.
on:
  push:
    branches: [main]
    paths: ["toolkit/infra/buildbarn/runner/**", ".github/workflows/runner-image.yaml"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { base: "ubuntu:24.04", tag: latest }
          - { base: "ubuntu:20.04", tag: ubuntu20.04 }   # the legacy baseline (projects on Buildroot <= 2021)
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: repo
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/buckroot-worker" >> "$GITHUB_OUTPUT"   # image names must be lowercase
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: toolkit/infra/buildbarn/runner
          push: true
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: BASE=${{ matrix.base }}
          tags: |
            ${{ steps.repo.outputs.image }}:${{ matrix.tag }}
            ${{ steps.repo.outputs.image }}:${{ matrix.tag }}-${{ github.sha }}
      - run: |
          echo "Pin this digest in the platform's runner_image variable: ${{ steps.repo.outputs.image }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
