apiVersion: v1
kind: Service
metadata:
  name: storage
  labels: {{- include "bb.labels" . | nindent 4 }}
spec:
  selector: { app: storage }
  ports:
    - { name: grpc, port: 8981 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: storage
  labels: {{- include "bb.labels" . | nindent 4 }}
spec:
  serviceName: storage
  replicas: 1
  selector:
    matchLabels: { app: storage }
  template:
    metadata:
      labels:
        app: storage
        {{- include "bb.labels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.diagnosticsPort | quote }}
    spec:
      securityContext:
        fsGroup: 65532
      initContainers:
        # bb-storage keeps its state next to the block files; the directories must exist and be writable.
        - name: state-dirs
          image: {{ .Values.images.busybox }}
          command: [sh, -c, "mkdir -p /storage-cas/persistent_state /storage-ac/persistent_state && chmod -R 0777 /storage-cas /storage-ac"]
          volumeMounts:
            - { name: cas, mountPath: /storage-cas }
            - { name: ac, mountPath: /storage-ac }
      containers:
        - name: storage
          image: {{ .Values.images.storage }}
          args: [/config/storage.jsonnet]
          ports:
            - { name: grpc, containerPort: 8981 }
            - { name: metrics, containerPort: {{ .Values.diagnosticsPort }} }
          resources: {{- toYaml .Values.storage.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: cas, mountPath: /storage-cas }
            - { name: ac, mountPath: /storage-ac }
      volumes:
        - name: config
          configMap: { name: bb-config-storage }
  volumeClaimTemplates:
    - metadata: { name: cas }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.storage.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources: { requests: { storage: {{ add .Values.storage.casSizeGiB 4 }}Gi } }   # a little headroom over the block file
    - metadata: { name: ac }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.storage.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources: { requests: { storage: {{ max 10 (add .Values.storage.acSizeGiB 1) }}Gi } }   # Hetzner volumes start at 10 GB
